<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  // GitHub Pages also serves this file but has no /api/: send the visit to the Vercel copy, which does.
  if (/\.github\.io$/.test(location.hostname)) location.replace("https://travel-problem-radar.vercel.app" + location.pathname.replace(/^\/travel-problem-radar-case-study/, "") + location.search + location.hash);
  // Without the trailing slash, radar-live.js resolves to /radar-live.js (a 404) and nothing renders.
  else if (!/(\/|\.html)$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Problem Radar — Live</title>
<meta name="description" content="Travel Problem Radar, updated every 5 hours. An AI model with web search gathers travel-industry problems on a schedule; visitors see the latest saved result." />
<style>
  html, body { margin: 0; background: #0B0B0D; }
  .live-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 10px clamp(14px, 4vw, 40px); border-bottom: 1px solid #2A2A34;
    font: 12px/1.5 'JetBrains Mono', ui-monospace, monospace; color: #93939F; }
  .live-strip b { color: #C6FF3D; font-weight: 500; letter-spacing: .08em; }
  .live-strip a { color: #F4F4F7; }
  .live-strip a:hover { color: #C6FF3D; }
  .live-strip .links { margin-left: auto; display: flex; gap: 16px; }
  noscript { display: block; padding: 40px; color: #F4F4F7; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div class="live-strip">
    <span><b>LIVE</b> &middot; Gathered every 5 hours by an AI model with web search. Check each source link; items are not verified.</span>
    <span class="links">
      <a href="../">&larr; Case study</a>
      <a href="../demo/">Sample demo</a>
      <a href="../subscribe/">Get it by email</a>
      <a id="acct" href="../signin/">Sign in</a>
      <a href="https://github.com/bhawnamanglapm/travel-problem-radar-case-study">Source</a>
    </span>
  </div>
  <script>
    // Signed in on this browser: the link goes to the account page instead.
    fetch("/api/session?action=me").then(function (r) { return r.ok ? r.json() : {}; }).then(function (b) {
      if (!b || !b.signedIn) return;
      var a = document.getElementById("acct");
      a.textContent = "Account";
      a.href = "../manage/";
    }).catch(function () {});
  </script>
  <div id="root"></div>
  <noscript>This page needs JavaScript.</noscript>
  <script src="radar-live.js"></script>
</body>
</html>
