name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild the demo and confirm the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code demo/radar.js || (echo "demo/radar.js is stale: run npm run build and commit it" && exit 1)
      - run: npm run check
